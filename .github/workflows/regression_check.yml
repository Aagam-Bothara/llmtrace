name: CPU tests

# CPU-only checks. There is no GPU runner; nothing here validates real vLLM.
# A GPU regression gate (llmtrace compare --fail-on-regression) can be added
# once traces exist from a self-hosted GPU runner; see docs/GPU_VALIDATION.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no GPU extras)
        run: pip install -e ".[dev]"
      - name: Unit and regression tests
        run: python -m pytest
      - name: Synthetic end-to-end example (fake engine, fake NVML)
        run: python examples/synthetic_replay.py --out ./traces_synthetic
      - name: CLI regression check on synthetic data (expected to report regressions, exit 0 without --fail flag)
        run: llmtrace compare --baseline ./traces_synthetic/baseline --current ./traces_synthetic/current --no-rich
      - name: Doctor, workload template and synthetic run (fake engine)
        run: |
          llmtrace doctor
          llmtrace workload template --output w.json
          llmtrace run --workload w.json --engine fake --out ./runs/base
          llmtrace run --workload w.json --engine fake --out ./runs/capped --config-name capped --set long_prefill_token_threshold=256
          llmtrace doctor ./runs/base
          llmtrace findings ./runs/base
          llmtrace decide --target "short ttft_p95 <= 50ms" --config base=./runs/base --config capped=./runs/capped
