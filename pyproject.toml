[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrace"
version = "0.2.0"
description = "Flight recorder, attribution, and autopsy for vLLM inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "llmtrace contributors"}
]
# Core runtime: offline analysis, CLI and CPU tests work with only these.
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# GPU telemetry via NVML (import is lazy; absent -> telemetry reported unavailable)
nvml = ["nvidia-ml-py>=12.535.133"]
# Parquet output/input
parquet = ["pyarrow>=12.0.0"]
# The one vLLM version whose engine interfaces were verified (see DEVELOPMENT.md).
# Linux + NVIDIA GPU only.
vllm = ["vllm==0.11.0", "transformers>=4.56,<5", "nvidia-ml-py>=12.535.133"]  # transformers 5.x breaks vLLM 0.11.0 tokenizer (all_special_tokens_extended)
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
llmtrace = "llmtrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
# As-run evidence scripts are kept byte-identical to what executed on the GPU.
exclude = ["docs/gpu_runs/**/overhead.py", "docs/gpu_runs/**/crosscheck.py", "docs/gpu_runs/**/crosscheck_bracketed.py"]
