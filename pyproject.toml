[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrace"
version = "0.1.0"
description = "Flight recorder, attribution, and autopsy for vLLM inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "llmtrace contributors"}
]
dependencies = [
    "vllm>=0.3.0",
    "nvidia-ml-py>=12.535.133",  # pynvml
    "pyarrow>=12.0.0",           # Parquet support
    "pandas>=2.0.0",             # Data analysis
    "click>=8.0.0",              # CLI
    "pydantic>=2.0.0",           # Config validation
    "rich>=13.0.0",              # Pretty CLI output
    "opentelemetry-api>=1.20.0", # Optional OTLP export
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
dcgm = [
    "dcgm-exporter>=3.1.0",  # DCGM support for enterprise
]

[project.scripts]
llmtrace = "llmtrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmtrace*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
